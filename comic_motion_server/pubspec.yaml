name: comic_motion_server
description: >-
  CLI and HTTP API for the comic_motion engine: single-image processing,
  folder batch jobs, a JSONL processing ledger and an async-job REST service.
version: 1.3.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  args: ^2.5.0
  comic_motion: ^1.3.1
  shelf: ^1.4.0
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
