name: comic_motion_flutter
description: >-
  Flutter widgets consuming comic_motion output: MotionGifView (placeholder
  crossfade, playback control, entrance frames) and ParallaxGyroView
  (gyro/touch parallax over interaction frame sets).
version: 0.1.0
repository: https://github.com/nexhub-app/comic-motion-effects
topics:
  - flutter
  - animation
  - gif
  - parallax
  - comic

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  comic_motion: ^1.3.1
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image: ^4.2.0 # 测试 fixture 生成（PNG/GIF 字节）
