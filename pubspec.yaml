name: comic_motion
description: A pure-Dart comic image motion engine (backend only). Splits a static comic image into depth layers and renders 32 layered motion effects (parallax / breathing / weather / light / manga dynamics / emotion envelope), exporting GIF and PNG frame sequences with deterministic, byte-reproducible output.
version: 1.3.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  args: ^2.5.0
  image: ^4.2.2
  shelf: ^1.4.0
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
