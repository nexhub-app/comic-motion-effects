name: comic_motion_shaders_example
description: >-
  Minimal demo for RealtimeMotionView: procedurally generated placeholder
  layers (stand-ins for core engine exportLayers output) driven by live
  sliders for parallax / breathing / sweep / vignette.
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  comic_motion_shaders:
    path: ../

flutter:
  uses-material-design: true
