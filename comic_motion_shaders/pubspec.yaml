name: comic_motion_shaders
description: >-
  GPU companion for comic_motion: FragmentShader real-time parallax,
  breathing, light sweep and vignette over exportLayers texture sets.
version: 0.1.0
repository: https://github.com/nexhub-app/comic-motion-effects
topics:
  - flutter
  - shader
  - animation
  - comic
  - gpu

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  comic_motion: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/shaders/
