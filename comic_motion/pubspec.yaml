name: comic_motion
description: >-
  Pure-Dart engine that splits a static comic page into depth layers and
  renders 32 layered comic effects as deterministic, byte-reproducible
  GIF/APNG output.
version: 1.3.1
repository: https://github.com/nexhub-app/comic-motion-effects
topics:
  - dart
  - flutter
  - gif
  - animation
  - image

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  image: ^4.2.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
