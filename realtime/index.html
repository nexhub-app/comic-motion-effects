<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>实时翻页渲染 · 阅读动效演示</title>
<style>
  :root {
    --paper: #f7f5f0;
    --paper-2: #efece5;
    --ink: #26241f;
    --ink-dim: #6f6a60;
    --hairline: rgba(38, 36, 31, 0.12);
    --accent: #8a6d3b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--paper-2);
    color: var(--ink);
    font-family: "Source Han Serif SC", "Noto Serif SC", Georgia, serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(38,36,31,0.82); color: #f0ede6;
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px;
    padding: 6px 14px; border-radius: 3px; letter-spacing: 0.04em;
    display: none; /* 按 F 或 ?hud=1 显示 */
    z-index: 10; white-space: nowrap;
  }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: var(--ink-dim); font-size: 12.5px; letter-spacing: 0.06em;
    transition: opacity 1.2s ease; text-align: center; z-index: 10;
  }
  #hint em { font-style: normal; color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">fps -- · frame -- ms · drop -- · mode --</div>
<div id="hint">拖动翻页 · <em>点击</em>左右半屏翻页 · 键盘 ←/→ · 松手回弹 · <em>F</em> 显示帧率</div>
<script>
(function () {
  "use strict";

  /* ================= 页面内容生成（无外部资源） ================= */
  function makePage(seed) {
    var W = 900, H = 1300;
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var g = c.getContext("2d");
    // 纸面
    g.fillStyle = "#f7f5f0";
    g.fillRect(0, 0, W, H);
    // 页眉页脚
    g.fillStyle = "rgba(38,36,31,0.45)";
    g.font = "22px Georgia, serif";
    g.fillText("第 " + (seed + 1) + " 页", 70, 84);
    g.textAlign = "right";
    g.fillText("实时渲染 · 完整回弹", W - 70, H - 64);
    g.textAlign = "left";
    g.strokeStyle = "rgba(38,36,31,0.14)";
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(70, 104); g.lineTo(W - 70, 104); g.stroke();
    // 标题区
    var titles = ["山谷的回声", "纸上的旅行", "光的重量", "时间之砂", "夜航西飞", "草木记"];
    g.fillStyle = "#26241f";
    g.font = "bold 46px 'Source Han Serif SC', 'Noto Serif SC', serif";
    g.fillText(titles[seed % titles.length], 70, 210);
    g.strokeStyle = "rgba(138,109,59,0.55)";
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(70, 240); g.lineTo(70 + 180, 240); g.stroke();
    // 正文段落
    g.fillStyle = "rgba(38,36,31,0.88)";
    g.font = "26px 'Source Han Serif SC', serif";
    var line = 300;
    for (var p = 0; p < 3; p++) {
      var indent = p === 0 ? 52 : 0;
      for (var r = 0; r < 7; r++) {
        var chars = 26 - (r % 3 === 2 ? 3 : 0);
        var x = 70 + indent;
        for (var i = 0; i < chars; i++) {
          var v = 0.82 + 0.13 * Math.sin(seed * 7 + p * 3 + r + i * 1.7);
          g.fillStyle = "rgba(38,36,31," + v.toFixed(2) + ")";
          g.fillText("風", x, line);
          x += 30;
        }
        line += 44;
      }
      line += 26;
    }
    // 插图占位（山与月，纯几何）
    var iy = line + 30;
    g.fillStyle = "rgba(120,134,150,0.35)";
    g.beginPath();
    g.moveTo(70, iy + 240); g.lineTo(280, iy); g.lineTo(490, iy + 240);
    g.closePath(); g.fill();
    g.fillStyle = "rgba(90,104,120,0.45)";
    g.beginPath();
    g.moveTo(360, iy + 240); g.lineTo(560, iy + 40); g.lineTo(760, iy + 240);
    g.closePath(); g.fill();
    g.fillStyle = "rgba(216,162,74,0.8)";
    g.beginPath(); g.arc(W - 170, iy + 60, 34, 0, Math.PI * 2); g.fill();
    // 页脚装饰
    g.fillStyle = "rgba(138,109,59,0.6)";
    g.beginPath(); g.arc(W / 2, H - 80, 4, 0, Math.PI * 2); g.fill();
    return c;
  }

  /* ================= 引擎状态 ================= */
  var stage = document.getElementById("stage");
  var hud = document.getElementById("hud");
  var hint = document.getElementById("hint");
  var canvas = document.createElement("canvas");
  stage.appendChild(canvas);
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(2, window.devicePixelRatio || 1);

  var W = 0, H = 0; // CSS 像素
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    book.w = Math.min(W * 0.92, 620);
    book.h = book.w * 1.4 > H * 0.94 ? H * 0.94 : book.w * 1.4;
    book.w = book.h / 1.4;
    book.x = (W - book.w) / 2;
    book.y = (H - book.h) / 2;
  }

  var book = { x: 0, y: 0, w: 0, h: 0 };
  var PAGE_COUNT = 8;
  var pages = [];
  for (var i = 0; i < PAGE_COUNT; i++) pages.push(makePage(i));

  // 翻页状态机：idle | dragging | animating
  var st = {
    mode: "idle",
    cur: 0,           // 当前页
    next: 1,          // 目标页
    dir: 1,           // 1=下一页, -1=上一页
    drag: 0,          // 0..1 翻页进度（拖动跟手）
    vx: 0,            // 松手速度（进度/秒）
    t0: 0,            // 动画开始时间 ms
    from: 0, to: 0,   // 动画起止进度
    autoDir: 1,       // 点击翻页方向
    pointerId: null,
    startX: 0, lastX: 0, lastT: 0,
    gyro: 0           // 曲率（跟手弹性）
  };

  var EASE_OUT = function (t) { return 1 - Math.pow(1 - t, 3); };
  var EASE_IO = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  // 回弹：末端轻微过冲再收回（鸿蒙式 rubber band）
  function OVERSHOOT(t) {
    if (t < 0.82) return EASE_OUT(t / 0.82) * 1.045;
    var u = (t - 0.82) / 0.18;
    return 1.045 - 0.045 * EASE_IO(u);
  }

  /* ================= 仿真卷页渲染 ================= */
  // p: 0..1 翻页进度；dir: 1 下一页
  // 曲线 C：卷页圆柱半径控制（拖动时由横向分量决定，跟手自然弯曲）
  function render(p, dir, curveX) {
    var cur = pages[st.cur];
    var nxt = pages[st.next];
    // 底：目标页（下一页在下面）
    ctx.fillStyle = "#eae7df";
    ctx.fillRect(0, 0, W, H);
    drawFitted(nxt, 0, 0);
    // 阴影随进度加深（目标页上的投影，模拟掀起的页面遮光）
    var sh = 0.10 + 0.22 * Math.sin(Math.PI * p);
    var g1 = ctx.createLinearGradient(book.x, 0, book.x + book.w * dir, 0);
    var edge = dir > 0 ? book.x : book.x + book.w;
    g1.addColorStop(0, "rgba(30,28,24," + (sh * 0.9).toFixed(3) + ")");
    g1.addColorStop(0.5, "rgba(30,28,24," + (sh * 0.35).toFixed(3) + ")");
    g1.addColorStop(1, "rgba(30,28,24,0)");
    ctx.save();
    ctx.beginPath(); ctx.rect(book.x, book.y, book.w, book.h); ctx.clip();
    ctx.fillStyle = g1;
    ctx.fillRect(book.x, book.y, book.w, book.h);
    ctx.restore();

    // 上面：当前页（卷曲）
    // p=0 平放；p=1 完全翻过（不可见）。用水平压缩 + 高光 + 背面模拟卷页圆柱。
    var cx = book.x + book.w / 2;
    // 翻起部分宽度 = w * cos 式收缩；follow = 1-p
    var follow = 1 - p;
    if (follow > 0.001) {
      ctx.save();
      ctx.beginPath(); ctx.rect(book.x, book.y, book.w, book.h); ctx.clip();
      // 圆柱弯曲：把当前页按 x 分条带绘制，越靠近折轴压缩越强（伪 3D 卷曲）
      var strips = 28;
      var axisX = dir > 0 ? book.x + book.w * (1 - follow) : book.x + book.w * follow;
      for (var s = 0; s < strips; s++) {
        var u0 = s / strips, u1 = (s + 1) / strips;
        // 源条带（整页坐标 0..1）
        var su0 = dir > 0 ? u0 : 1 - u1;
        var su1 = dir > 0 ? u1 : 1 - u0;
        // 该条带相对折轴的距离（0..1，折轴处=0）
        var midU = (u0 + u1) / 2;
        var dist = dir > 0 ? (book.x + book.w * midU - axisX) / (book.w * follow + 0.0001)
                           : (axisX - book.x - book.w * midU) / (book.w * follow + 0.0001);
        if (dist < 0) continue;
        dist = Math.min(1, dist);
        // 压缩映射：靠近折轴压缩多（cos 曲线），跟手曲线 curveX 调节软硬
        var compress = Math.cos(dist * Math.PI / 2 * (0.65 + 0.35 * curveX));
        var targetW = (u1 - u0) * book.w * Math.max(0.12, compress);
        // 目标 x：从折轴向翻起侧铺开
        var tx = dir > 0 ? axisX + (book.x + book.w - axisX) * midU / Math.max(0.0001, follow) * targetW / ((u1 - u0) * book.w) * (u1 - u0) * book.w
                         : axisX - (axisX - book.x) * midU / Math.max(0.0001, follow) * targetW / ((u1 - u0) * book.w) * (u1 - u0) * book.w;
        // 简化：直接按条带序号线性铺（视觉近似足够）
        var bx = dir > 0 ? axisX + s / strips * (book.w * follow) : axisX - s / strips * (book.w * follow);
        var bw = book.w / strips * Math.max(0.12, compress) + 0.6;
        var sxp = su0 * 900, swp = (su1 - su0) * 900;
        try {
          ctx.drawImage(cur, sxp, 0, Math.max(1, swp), 1300, bx, book.y, Math.max(0.5, bw), book.h);
        } catch (e) { /* 越界保护 */ }
        // 圆柱高光：折轴附近提亮
        var glow = Math.pow(1 - dist, 3) * 0.28;
        if (glow > 0.004) {
          ctx.fillStyle = "rgba(255,252,240," + glow.toFixed(3) + ")";
          ctx.fillRect(bx, book.y, Math.max(0.5, bw), book.h);
        }
        // 背面透色（接近翻完时见纸背）
        if (dist > 0.86 && p > 0.5) {
          ctx.fillStyle = "rgba(239,236,229," + ((dist - 0.86) / 0.14 * 0.85 * Math.min(1, (p - 0.5) * 2)).toFixed(3) + ")";
          ctx.fillRect(bx, book.y, Math.max(0.5, bw), book.h);
        }
      }
      // 卷轴落影：投在下一页上
      var ax = dir > 0 ? axisX : axisX;
      var g2 = ctx.createLinearGradient(ax - 18 * dir, 0, ax + 30 * dir, 0);
      g2.addColorStop(0, "rgba(25,22,18,0)");
      g2.addColorStop(0.42, "rgba(25,22,18," + (0.34 * (0.4 + 0.6 * Math.sin(Math.PI * p))).toFixed(3) + ")");
      g2.addColorStop(1, "rgba(25,22,18,0)");
      ctx.fillStyle = g2;
      ctx.fillRect(ax - 24 * dir, book.y, 56, book.h);
      // 右缘细阴影
      if (dir > 0) {
        var g3 = ctx.createLinearGradient(book.x + book.w - 10, 0, book.x + book.w, 0);
        g3.addColorStop(0, "rgba(30,28,24,0)");
        g3.addColorStop(1, "rgba(30,28,24,0.18)");
        ctx.fillStyle = g3; ctx.fillRect(book.x + book.w - 10, book.y, 10, book.h);
      } else {
        var g4 = ctx.createLinearGradient(book.x, 0, book.x + 10, 0);
        g4.addColorStop(0, "rgba(30,28,24,0.18)");
        g4.addColorStop(1, "rgba(30,28,24,0)");
        ctx.fillStyle = g4; ctx.fillRect(book.x, book.y, 10, book.h);
      }
      ctx.restore();
    }
    // 书本外框细线（纸感）
    ctx.strokeStyle = "rgba(38,36,31,0.18)";
    ctx.lineWidth = 1;
    ctx.strokeRect(book.x + 0.5, book.y + 0.5, book.w - 1, book.h - 1);
  }

  function drawFitted(page, dx, dy) {
    var s = Math.min(book.w / 900, book.h / 1300);
    var w = 900 * s, h = 1300 * s;
    ctx.drawImage(page, book.x + (book.w - w) / 2 + dx, book.y + (book.h - h) / 2 + dy, w, h);
  }

  function drawIdle() {
    ctx.fillStyle = "#eae7df";
    ctx.fillRect(0, 0, W, H);
    // 底层页边（错位堆叠出纸感）
    ctx.fillStyle = "#e4e1d8";
    ctx.fillRect(book.x + 5, book.y + 5, book.w, book.h);
    ctx.fillStyle = "#e9e6de";
    ctx.fillRect(book.x + 2.5, book.y + 2.5, book.w, book.h);
    drawFitted(pages[st.cur], 0, 0);
    ctx.strokeStyle = "rgba(38,36,31,0.18)";
    ctx.lineWidth = 1;
    ctx.strokeRect(book.x + 0.5, book.y + 0.5, book.w - 1, book.h - 1);
    // 左右翻页热区提示（首次）
    if (!hintShown) return;
  }

  /* ================= 交互（跟手） ================= */
  var hintShown = false;
  setTimeout(function () { hint.style.opacity = "0"; }, 5200);

  function pt(e) { return e.touches ? e.touches[0].clientX : e.clientX; }

  function onDown(e) {
    if (st.mode !== "idle") return;
    st.pointerId = pt(e);
    st.startX = st.lastX = pt(e);
    st.lastT = performance.now();
    st.vx = 0;
    st.dir = st.lastX > W / 2 ? 1 : -1;
    st.next = (st.cur + st.dir + PAGE_COUNT) % PAGE_COUNT;
    st.drag = 0;
    st.mode = "dragging";
    hintShown = true;
    e.preventDefault();
  }

  function onMove(e) {
    if (st.mode !== "dragging") return;
    var x = pt(e);
    var now = performance.now();
    var dt = Math.max(1, now - st.lastT);
    var instV = (x - st.lastX) / dt; // px/ms
    st.vx = 0.7 * st.vx + 0.3 * instV * 1000; // px/s 平滑
    st.lastX = x; st.lastT = now;
    var dx = x - st.startX;
    // 跟手：进度 = 位移/书宽，反向拖动直接减；允许跟手越过 0（回拉）
    var raw = st.dir * dx / book.w;
    st.drag = Math.max(-0.12, Math.min(1, raw));
    if (st.drag < 0) {
      // 反向回拉：进度回 0，进入"欲翻还休"状态
      st.drag = 0;
    }
    // 曲率跟手：横向速度决定页面软硬
    st.gyro = Math.max(0, Math.min(1, Math.abs(st.vx) / 2600));
    e.preventDefault();
  }

  function onUp(e) {
    if (st.mode !== "dragging") return;
    var vProgress = st.vx / book.w * st.dir; // 进度/秒
    st.mode = "animating";
    st.t0 = performance.now();
    var TH = 0.32; // 越过 32% 或速度足够即翻页
    if (st.drag > TH || vProgress > 0.55) {
      st.from = st.drag; st.to = 1; st.autoDir = st.dir; st.commit = true;
    } else {
      st.from = st.drag; st.to = 0; st.autoDir = st.dir; st.commit = false;
    }
    e.preventDefault();
  }

  function clickTurn(dir) {
    if (st.mode !== "idle") return;
    st.dir = dir;
    st.next = (st.cur + dir + PAGE_COUNT) % PAGE_COUNT;
    st.mode = "animating";
    st.t0 = performance.now();
    st.from = 0; st.to = 1; st.autoDir = dir; st.commit = true;
    st.drag = 0;
    hintShown = true;
  }

  stage.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  stage.addEventListener("touchstart", onDown, { passive: false });
  stage.addEventListener("touchmove", onMove, { passive: false });
  stage.addEventListener("touchend", onUp, { passive: false });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") clickTurn(1);
    if (e.key === "ArrowLeft") clickTurn(-1);
    if (e.key === "f" || e.key === "F") hud.style.display = hud.style.display === "block" ? "none" : "block";
  });

  /* ================= 动画循环 + 性能台账 ================= */
  var fps = { frames: 0, acc: 0, last: performance.now(), value: 0, worst: 16.7, drops: 0, total: 0 };
  var ledger = []; // 结构化台账：场景/开始/结束/fps/掉帧
  var visible = (typeof document.hidden !== "undefined") ? !document.hidden : true;
  document.addEventListener("visibilitychange", function () {
    visible = !document.hidden;
    if (visible) { fps.last = performance.now(); }
  });
  window.addEventListener("blur", function () { visible = false; });
  window.addEventListener("focus", function () { visible = true; fps.last = performance.now(); });

  function frame(now) {
    requestAnimationFrame(frame);
    if (!visible) return;
    var dtms = now - fps.last;
    fps.last = now;
    fps.total++;
    if (dtms > 0) {
      fps.acc += dtms;
      fps.frames++;
      if (dtms > 34) fps.drops++; // >2 帧时间算掉帧
      if (dtms > fps.worst) fps.worst = dtms;
      if (fps.acc >= 500) {
        fps.value = Math.round(1000 * fps.frames / fps.acc);
        fps.acc = 0; fps.frames = 0;
      }
    }

    var t = now / 1000;
    // 呼吸：idle 时页面极缓浮沉（阅读 app 的"活纸"感）
    var breathe = 0.004 * Math.sin(t * 2 * Math.PI / 6);

    if (st.mode === "animating") {
      var dur = 520; // ms：与鸿蒙手感接近的轻快时长
      var raw = Math.min(1, (now - st.t0) / dur);
      var eased = st.commit ? OVERSHOOT(raw) : EASE_IO(raw);
      st.drag = st.from + (st.to - st.from) * eased;
      if (raw >= 1) {
        if (st.commit) { st.cur = st.next; }
        st.mode = "idle"; st.drag = 0;
      }
      render(Math.max(0, Math.min(1, st.drag)), st.dir, st.gyro);
    } else if (st.mode === "dragging") {
      render(Math.max(0, Math.min(1, st.drag)), st.dir, st.gyro);
    } else {
      drawIdle(breathe);
      // idle 呼吸：极轻微整体缩放
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(1 + breathe, 1 + breathe);
      ctx.translate(-W / 2, -H / 2);
      ctx.restore();
    }

    if (hud.style.display === "block") {
      hud.textContent = "fps " + fps.value + " · frame " + dtms.toFixed(1) + " ms · drop " + fps.drops + "/" + fps.total + " · mode " + st.mode + " · p " + st.drag.toFixed(2);
    }
  }
  requestAnimationFrame(frame);

  // 台账导出（双击 HUD，或地址栏带 export=1 时自动下载）
  hud.addEventListener("dblclick", exportLedger);
  function exportLedger() {
    var data = {
      exportedAt: new Date().toISOString(),
      userAgent: navigator.userAgent,
      dpr: dpr, width: W, height: H,
      scene: "page-turn-drag/click/bounce",
      fpsAvg: fps.value, drops: fps.drops, totalFrames: fps.total, worstFrameMs: +fps.worst.toFixed(1),
      note: "浏览器 rAF 实测；鸿蒙对照需真机录屏后按同一口径测量"
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "render_ledger.json";
    a.click();
  }
  // resize
  window.addEventListener("resize", resize);
  resize();
  // ?hud=1 自动显示帧率；export=1 运行 8 秒后自动导出台账
  var qp = new URLSearchParams(location.search);
  if (qp.get("hud") === "1") hud.style.display = "block";
  if (qp.get("export") === "1") setTimeout(exportLedger, 8000);
})();
</script>
</body>
</html>
