name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 门禁：钉住与 pubspec.lock 同源解析的 Dart 版本（本地开发所用 3.13.0），
  # 红/绿只反映代码与锁定依赖的状态，不随 stable 通道漂移。
  # 升级依赖或 Dart 时手动改这里，配合 pubspec.lock 一起动。
  test:
    name: analyze + test (dart 3.13.0 / ${{ matrix.os }} / ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package: [comic_motion, comic_motion_server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

  # 前瞻：跟踪 stable 通道，提前暴露未来 Dart 版本的破坏性变更。
  # continue-on-error：失败只出黄灯预警，不让 CI 变红（README badge 不受影响）。
  stable-preview:
    name: stable preview (dart stable / ubuntu / ${{ matrix.package }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [comic_motion, comic_motion_server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test
