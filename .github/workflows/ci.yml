name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 门禁：钉住与 pubspec.lock 同源解析的 Dart 版本（本地开发所用 3.13.0），
  # 红/绿只反映代码与锁定依赖的状态，不随 stable 通道漂移。
  # 升级依赖或 Dart 时手动改这里，配合 pubspec.lock 一起动。
  test:
    name: analyze + test (dart 3.13.0 / ${{ matrix.os }} / ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package: [comic_motion, comic_motion_server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0

      # engine 1.4.0（partMotion 侧车等 API）尚未发布 pub.dev，server 的
      # hosted 声明 ^1.3.1 解析不到新 API。发布窗口期内 CI 同本地开发一致，
      # 用 path override 指向工作区引擎；1.4.0 上架后删除本步（见
      # comic_motion/doc/release_checklist.md 第二节）。
      - name: Wire server to workspace engine (pre-publish window)
        if: matrix.package == 'comic_motion_server'
        run: printf 'dependency_overrides:\n  comic_motion:\n    path: ../comic_motion\n' > pubspec_overrides.yaml
        shell: bash

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

  # 前瞻：跟踪 stable 通道，提前暴露未来 Dart 版本的破坏性变更。
  # continue-on-error：失败只出黄灯预警，不让 CI 变红（README badge 不受影响）。
  stable-preview:
    name: stable preview (dart stable / ubuntu / ${{ matrix.package }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [comic_motion, comic_motion_server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # 与 test job 同理：发布窗口期内 server 指向工作区引擎（见上）。
      - name: Wire server to workspace engine (pre-publish window)
        if: matrix.package == 'comic_motion_server'
        run: printf 'dependency_overrides:\n  comic_motion:\n    path: ../comic_motion\n' > pubspec_overrides.yaml
        shell: bash

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

  # 伴生包含 Flutter widgets（comic_motion_flutter: MotionGifView / ParallaxGyroView；
  # comic_motion_shaders: RealtimeMotionView + fragment shader 资产），widget test
  # 需 Flutter tester，独立于纯 Dart 矩阵。stable 通道跟随本仓库锁定的
  # Flutter 版本线（>=3.22 / Dart 3.4），与核心包 environment 约束一致。
  flutter-package:
    name: flutter analyze + test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [comic_motion_flutter, comic_motion_shaders]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
